[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-file-redactor"
version = "0.1.0"
description = "本地离线文件脱敏工具（docx/xlsx/pdf/pptx），不可逆替换敏感信息，绝不联网、绝不覆盖原文件"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "LocalFileRedactor contributors" }]
keywords = ["脱敏", "隐私", "离线", "redaction", "gdpr", "anonymize"]

# 说明：GUI 与 OCR 相关依赖放在可选组里，
# 保证 core（识别引擎）在最小依赖环境下也能跑单元测试。
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# 第一阶段：docx / xlsx / 文本型 PDF
docx = ["python-docx>=1.1"]
xlsx = ["openpyxl>=3.1"]
pdf = ["PyMuPDF>=1.24"]
# 第二阶段：pptx / 扫描件 PDF（OCR）
pptx = ["python-pptx>=0.6.10"]
ocr = ["rapidocr-onnxruntime>=1.3"]
# GUI
gui = ["PySide6>=6.5"]
# 开发与打包
dev = ["pytest>=7.4", "pyinstaller>=6.0"]

[project.scripts]
redactor = "redactor.cli:main"

[project.urls]
Homepage = "https://github.com/your-name/local-file-redactor"
Repository = "https://github.com/your-name/local-file-redactor"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# 让测试无需安装即可导入 src/redactor
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:redactor.*"]