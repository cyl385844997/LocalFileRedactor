# 内置脱敏规则
#
# 加载约定：
#   - 本文件由 redactor.core.rules 解析，任何语法错误 / 正则编译失败 / 字段非法
#     都会抛出 RuleLoadError 并指明行号，绝不静默跳过任何一条规则。
#
# 字段说明：
#   name        (必填) 规则名，同时作为默认占位符名称，如 name: 手机号 -> "[手机号]"
#   pattern     (必填) Python re 正则，使用单引号包裹，避免 YAML 转义问题
#   placeholder (选填) 自定义占位符文本，缺省为 "[<name>]"
#   numbered    (选填) true 则同一原文复用同一编号，如 "[手机号#1]"；隐私性弱于统一占位符
#   enabled     (选填) false 则该规则不参与匹配（但仍会被解析与校验）
#   validator   (选填) 校验函数名，用于降低误报。可选：id_card、luhn
#   flags       (选填) re 标志名列表，如 [IGNORECASE, MULTILINE]
#   description (选填) 规则说明，仅用于文档与报告，不参与匹配

version: 1

rules:
  - name: 手机号
    description: 中国大陆手机号（1 开头，第二位 3-9，共 11 位）
    pattern: '(?<!\d)1[3-9]\d{9}(?!\d)'
    placeholder: '[手机号]'

  - name: 身份证号
    description: 18 位居民身份证号，含末位校验码验证以降低误报
    pattern: '(?<![0-9A-Za-z])\d{17}[\dXx](?![0-9A-Za-z])'
    placeholder: '[身份证号]'
    validator: id_card

  - name: 银行卡号
    description: 16-19 位银行卡号，含 Luhn 校验；优先级低于身份证号
    pattern: '(?<!\d)\d{16,19}(?!\d)'
    placeholder: '[银行卡号]'
    validator: luhn

  - name: 邮箱
    description: 常见邮箱地址
    pattern: '(?<![A-Za-z0-9._%+-])[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+(?![A-Za-z0-9.-])'
    placeholder: '[邮箱]'

  - name: IP地址
    description: IPv4 地址，逐段校验 0-255
    pattern: '(?<![\d.])(?:(?:25[0-5]|2[0-4]\d|1\d{2}|[1-9]?\d)\.){3}(?:25[0-5]|2[0-4]\d|1\d{2}|[1-9]?\d)(?![\d.])'
    placeholder: '[IP地址]'

  - name: IPv6地址
    description: 常见 IPv6 形态（简写与完整写法）。默认关闭，误报较多，按需启用
    pattern: '(?<![0-9A-Fa-f:])(?:[0-9A-Fa-f]{1,4}:){2,7}(?::|[0-9A-Fa-f]{1,4}|:(?::[0-9A-Fa-f]{1,4}){1,7})(?![0-9A-Fa-f:])'
    placeholder: '[IPv6地址]'
    enabled: false